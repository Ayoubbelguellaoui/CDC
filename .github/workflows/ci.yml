name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compiler: g++
            cc: gcc
            cxx: g++
          - compiler: clang++
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: All Tests
        run: ctest --test-dir build --output-on-failure

      - name: CLI Smoke Test
        run: |
          # Findings fixture must exit 1 (FINDINGS): 0 means missed
          # findings, >1 means crash/config error.
          set +e
          ./build/src/opencdc check tests/fixtures/sv/cdc_crossing.sv --top simple_cdc_crossing --format json > /dev/null
          test $? -eq 1 || { echo "expected exit 1 (findings)"; exit 1; }
          set -e
          # Clean fixture (no findings = exit 0)
          ./build/src/opencdc check tests/fixtures/sv/sync_2ff.sv --top sync_2ff --format text
          ./build/src/opencdc check tests/fixtures/sv/gated_clock.sv --top gated_clock --verbose
          # SARIF output must be schema-shaped (version 2.1.0, runs[])
          set +e
          ./build/src/opencdc check tests/fixtures/sv/cdc_crossing.sv --top simple_cdc_crossing --format sarif > sarif.json
          test $? -eq 1 || { echo "expected exit 1 (findings)"; exit 1; }
          set -e
          python3 -c "import json;d=json.load(open('sarif.json'));assert d['version']=='2.1.0' and d['runs']"
          echo "CLI smoke test passed"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure (MSVC, C++20)
        run: cmake -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: All Tests
        run: ctest --test-dir build -C Release --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lcov

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS="--coverage"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Capture Coverage
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,negative
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' --output-file coverage.info --ignore-errors negative
          lcov --list coverage.info

      - name: Upload Coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: coverage.info
          fail_ci_if_error: false

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure (ASan + UBSan)
        run: |
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san -j$(nproc)

      - name: Run Tests with Sanitizers
        run: ctest --test-dir build-san --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check formatting
        run: |
          sudo apt-get install -y clang-format-18
          find src/ tests/ \( -name '*.cpp' -o -name '*.h' \) | xargs clang-format-18 --dry-run --Werror
