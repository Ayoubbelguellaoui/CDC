name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: opencdc-linux-x64
          - os: macos-latest
            artifact: opencdc-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Strip binary
        run: strip build/src/opencdc

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/src
          tar czf opencdc-linux-x64.tar.gz opencdc
          cp opencdc-linux-x64.tar.gz "${{ github.workspace }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/src
          tar czf opencdc-macos-arm64.tar.gz opencdc
          cp opencdc-macos-arm64.tar.gz "${{ github.workspace }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ github.workspace }}/${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Generate SBOMs
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./
          format: spdx-json
          output-file: opencdc-sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign artifacts (keyless)
        run: |
          for f in opencdc-linux-x64/opencdc-linux-x64.tar.gz \
                   opencdc-macos-arm64/opencdc-macos-arm64.tar.gz; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" --output-certificate "$f.pem"
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            opencdc-linux-x64/opencdc-linux-x64.tar.gz
            opencdc-linux-x64/opencdc-linux-x64.tar.gz.sig
            opencdc-linux-x64/opencdc-linux-x64.tar.gz.pem
            opencdc-macos-arm64/opencdc-macos-arm64.tar.gz
            opencdc-macos-arm64/opencdc-macos-arm64.tar.gz.sig
            opencdc-macos-arm64/opencdc-macos-arm64.tar.gz.pem
            opencdc-sbom.spdx.json
