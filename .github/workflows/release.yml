name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: opencdc-linux-x64
          - os: macos-latest
            artifact: opencdc-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Strip binary
        run: strip build/src/opencdc

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/src
          tar czf opencdc-linux-x64.tar.gz opencdc
          cp opencdc-linux-x64.tar.gz "${{ github.workspace }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/src
          tar czf opencdc-macos-arm64.tar.gz opencdc
          cp opencdc-macos-arm64.tar.gz "${{ github.workspace }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ github.workspace }}/${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            opencdc-linux-x64/opencdc-linux-x64.tar.gz
            opencdc-macos-arm64/opencdc-macos-arm64.tar.gz
